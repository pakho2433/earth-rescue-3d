<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>地球生病了：拯救地球 3D 任務</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;font-family:"PingFang HK","Noto Sans CJK TC","Microsoft JhengHei","Noto Serif CJK TC",sans-serif;color:#fff}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(10,30,40,.72);border-radius:14px;padding:10px 14px;backdrop-filter:blur(4px);box-shadow:0 2px 10px rgba(0,0,0,.3)}
#task{position:absolute;left:10px;top:10px;max-width:min(430px,60vw)}
#task h2{margin:0 0 4px;font-size:18px;color:#ffe36e}
#task p{margin:0;font-size:15px;line-height:1.45}
#tbar{height:8px;background:#234;border-radius:4px;margin-top:6px;overflow:hidden}#tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cd964,#a8ff60);transition:width .3s}
#stats{position:absolute;right:10px;top:10px;text-align:right;font-size:15px;line-height:1.5}
#stats b{color:#ffe36e;font-size:18px}
#compass{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center;font-size:13px}
#arrow{font-size:28px;display:inline-block;transition:transform .1s;color:#ffe36e;text-shadow:0 0 6px #000}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid rgba(255,255,255,.85);border-radius:50%}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);font-size:17px;white-space:nowrap;display:none}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:19px;display:none;text-align:center;max-width:80vw}
#toast.bad{background:rgba(150,40,30,.85)}#toast.good{background:rgba(30,130,60,.85)}
.btn{pointer-events:auto;touch-action:none;border:none;border-radius:50%;background:rgba(255,200,40,.85);color:#222;font-weight:bold;font-family:inherit}
#act{position:absolute;right:28px;bottom:36px;width:110px;height:110px;font-size:22px;display:none}
#tp{position:absolute;right:10px;top:126px;border-radius:12px;width:auto;height:auto;padding:8px 12px;font-size:15px;background:rgba(80,180,255,.9)}
#joy{position:absolute;left:28px;bottom:28px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.4);display:none}
#knob{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:rgba(255,255,255,.6)}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,20,30,.55);pointer-events:auto;touch-action:none}
.card{background:#fffdf3;color:#222;border-radius:18px;padding:22px 26px;max-width:min(640px,92vw);max-height:88vh;overflow:auto;font-size:17px;line-height:1.6;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.card h1{margin:0 0 8px;color:#1b7a3a;font-size:26px}.card h3{margin:6px 0;color:#c05a00}
.card .go{display:block;margin:14px auto 0;border-radius:14px;padding:12px 30px;font-size:20px;background:#2fa84f;color:#fff;border:none;font-family:inherit;touch-action:none}
.hl{background:#fff1a8;padding:0 3px;border-radius:3px}
</style>
</head>
<body>
<div id="hud">
  <div id="task" class="panel"><h2 id="ttitle">任務</h2><p id="tdesc"></p><div id="tbar"><i></i></div></div>
  <div id="compass" class="panel"><span id="arrow">⬆</span><div id="dist"></div></div>
  <div id="stats" class="panel">分數 <b id="score">0</b><br>任務 <span id="tcount">0/0</span><br><span id="meter"></span></div>
  <button id="tp" class="btn">🚀 傳送到任務</button>
  <div id="cross"></div>
  <div id="prompt" class="panel"></div>
  <div id="toast" class="panel"></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="act" class="btn">動作</button>
</div>
<div id="modal" class="modal"><div class="card" id="card">
<h1>🌏 地球生病了：拯救地球任務</h1>
<p>地球的天然資源被不當使用，生態環境受到破壞！你要走遍<b>資源倉庫、河流、山坡、農田、沙漠、水渠、發電區和香港街道</b>，親手完成 8 個拯救任務。</p>
<h3>電腦操作</h3><p>按畫面開始 → <b>W A S D</b> 移動、<b>滑鼠</b> 轉視角、<b>左鍵 / E</b> 拿起、放下、使用；Shift 跑步；Esc 放開滑鼠。</p>
<h3>iPad / 手機操作</h3><p>左下<b>搖桿</b>移動、右邊畫面<b>拖動</b>轉視角、按黃色<b>「動作」</b>鍵拿起、放下、使用。</p>
<p>👉 跟着上方的<b>黃色箭咀</b>和地上的<b>光柱</b>前往任務地點，也可按「傳送到任務」。</p>
<button class="go" id="start">開始拯救地球！</button></div></div>
<script type="module" src="main.js"></script>
</body>
</html>
